services:
  # Managed Redis Instance for Distributed Locks
  - type: redis
    name: fastdrop-redis
    plan: free # Change to starter/standard for production
    ipAllowList: [] # Allowed to be accessed internally by the web service
    
  # FastDrop API Docker Web Service
  - type: web
    name: fastdrop-api
    env: docker
    # Free services have an ephemeral filesystem and are unsuitable for file
    # transfers. For reliable hosted transfers, change to `starter` or above and
    # attach a disk at /app/storage in the Render Dashboard (see README).
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Inject the internal Redis connection string securely
      - key: ConnectionStrings__Redis
        fromService:
          type: redis
          name: fastdrop-redis
          property: connectionString
      # Disables inotify file watchers for config files (required on Render free tier)
      # ASP.NET Core watches appsettings.json for hot-reload by default, which exhausts
      # the OS inotify limit (128) on Render's shared infra. Not needed in production.
      - key: DOTNET_hostBuilder__reloadConfigOnChange
        value: "false"
      # Set this after attaching the persistent disk described above.
      # - key: Storage__BasePath
      #   value: /app/storage/transfers
      # MetaDefender Cloud is used in Production. Add its API key in the Render
      # Dashboard; an unavailable/misconfigured scanner never produces a link.
      - key: MalwareScanner__MetaDefenderCloud__ApiKey
        sync: false
      # Neon DB Connection String must be added via the Render Dashboard manually for security
      - key: ConnectionStrings__DefaultConnection
        sync: false 
