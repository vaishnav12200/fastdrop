version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fastdrop_sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fastdrop_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastdrop_api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=FastDrop;User Id=sa;Password=YourStrong@Password;TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
    volumes:
      - storage_data:/app/storage
    depends_on:
      - sqlserver
      - redis
    restart: unless-stopped

volumes:
  sql_data:
  redis_data:
  storage_data:
