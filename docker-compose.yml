services:
  # Local-only metadata database. Do not point local Docker at the same Neon
  # database as Render: each environment has different chunk storage, and a
  # scan worker in one environment would otherwise fail the other's uploads.
  postgres:
    image: postgres:16-alpine
    container_name: fastdrop_postgres
    environment:
      POSTGRES_DB: fastdrop
      POSTGRES_USER: fastdrop
      POSTGRES_PASSWORD: fastdrop_local_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastdrop -d fastdrop"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fastdrop_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.5.4
    container_name: fastdrop_clamav
    environment:
      - CLAMD_CONF_TCPSocket=3310
      - CLAMD_CONF_StreamMaxLength=4G
      - CLAMD_CONF_MaxScanSize=4G
      - CLAMD_CONF_MaxFileSize=4G
      - CLAMD_CONF_AlertExceedsMax=yes
      - CLAMD_CONF_MaxThreads=2
    volumes:
      - clamav_database:/var/lib/clamav
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastdrop_api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Overrides any Neon connection in .env. Local uploads must use this
      # isolated database because their chunks live in the local Docker volume.
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=fastdrop;Username=fastdrop;Password=fastdrop_local_only
      - ConnectionStrings__Redis=redis:6379
      - MalwareScanner__Host=clamav
      - MalwareScanner__Port=3310
      - MalwareScanner__Provider=ClamAv
      - Storage__BasePath=/app/storage/transfers
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      clamav:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
  clamav_database:
