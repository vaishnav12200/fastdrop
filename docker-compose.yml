version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: fastdrop_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastdrop_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Redis=redis:6379
    volumes:
      - storage_data:/app/storage
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
  storage_data:
